name: SilverForge static app CI

on:
  push:
    branches:
      - silverforge-development
  pull_request:
    branches:
      - silverforge-development

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Run tests
        run: npm test
      - name: Build static app
        run: npm run build
